model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
service_tier = "fast"
web_search = "live"
approval_policy = "on-request"
approvals_reviewer = "user"
default_permissions = "reviewed-writes"

[features]
fast_mode = true

[agents]
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "xhigh"

[permissions.reviewed-writes]
description = "Read-only workspace with writable system temporary roots."
extends = ":read-only"

[permissions.reviewed-writes.filesystem]
":tmpdir" = "write"
":slash_tmp" = "write"
"~/.aws" = "deny"
"~/.claude/.credentials.json" = "deny"
"~/.config/gh/hosts.yml" = "deny"
"~/.codex/auth.json" = "deny"
"~/.docker/config.json" = "deny"
"~/.gnupg" = "deny"
"~/.kube" = "deny"
"~/.local/share/opencode/auth.json" = "deny"
"~/.netrc" = "deny"
"~/.npmrc" = "deny"
"~/.pypirc" = "deny"
"~/.ssh" = "deny"
glob_scan_max_depth = 64

[permissions.reviewed-writes.filesystem.":workspace_roots"]
"." = "read"
".env" = "deny"
".env.*" = "deny"
"secrets" = "deny"
"**/*.key" = "deny"
"**/*.pem" = "deny"
"**/*credentials*" = "deny"

[permissions.reviewed-writes.network]
enabled = false

[projects."/home/peregrinus/Projects/repos/dotfiles/dotfiles-ai"]
trust_level = "trusted"

[projects."/home/peregrinus/Projects"]
trust_level = "trusted"
